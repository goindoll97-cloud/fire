name: Thinner CAS regulation versus saturated vapor (screening)
on:
  push:
    branches:
      - main
    paths:
      - 'research/korean_thinners_271/v2/src/analyze_regulatory_vapor_gap.py'
      - 'research/korean_thinners_271/v2/src/test_regulatory_vapor_gap.py'
      - 'research/korean_thinners_271/v2/data/verified_regulatory_thresholds_20261024.csv'
      - 'research/korean_thinners_271/v2/results/species_central_270.csv.gz'
      - '.github/workflows/thinner-regulatory-vapor-audit.yml'
  workflow_dispatch:
jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline dataframe runtime
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.0,<3'
      - name: Test exact mass-fraction rule comparisons
        run: PYTHONPATH=research/korean_thinners_271/v2/src python -m unittest discover -s research/korean_thinners_271/v2/src -p 'test_regulatory_vapor_gap.py' -v
      - name: Run selected-CAS mass-to-vapor crosswalk
        run: PYTHONPATH=research/korean_thinners_271/v2/src python research/korean_thinners_271/v2/src/analyze_regulatory_vapor_gap.py
      - name: Upload screened documents and cases
        uses: actions/upload-artifact@v4
        with:
          name: thinner-regulatory-vapor-screen
          path: research/korean_thinners_271/v2/results/regulatory_gap/*
          if-no-files-found: error
