name: Korean thinner 271 data regression
on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - 'research/korean_thinners_271/**'
      - 'thinner_vle_reference_25C.csv'
      - '.github/workflows/korean-thinner-271.yml'
  pull_request:
    paths:
      - 'research/korean_thinners_271/**'
      - 'thinner_vle_reference_25C.csv'
      - '.github/workflows/korean-thinner-271.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate linked MSDS dataset
        run: python research/korean_thinners_271/src/validate_271.py
      - name: Install PDF parsing dependency for synthetic MSDS regression fixtures
        run: python -m pip install 'pymupdf>=1.24,<2'
      - name: Model-free test suite (no HANNA checkpoints in CI)
        run: python -m unittest discover -s research/korean_thinners_271/src -p 'test_*.py' -v
      - name: Install model-free v2 audit dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2.0,<3' 'matplotlib>=3.8,<4' 'scipy>=1.13,<2'
      - name: Validate 270-MSDS section-one use audit and fail-closed comparisons
        run: python -m unittest discover -s research/korean_thinners_271/v2/src -p 'test_use_audit.py' -v
      - name: Test no-lab inference, Pareto screening and version rules
        run: python -m unittest discover -s research/korean_thinners_271/v2/src -p 'test_nonexperimental.py' -v
      - name: Recompute corrected pooled-pair uncertainty and Pareto categories
        run: PYTHONPATH=research/korean_thinners_271/v2/src python research/korean_thinners_271/v2/src/analyze_pooled.py
      - name: Recompute three-model versus official/supplementary OEL sensitivity
        run: PYTHONPATH=research/korean_thinners_271/v2/src python research/korean_thinners_271/v2/src/analyze_nonexperimental_validation.py
      - name: Audit alternative MSDS revision selection without changing primary sample
        run: PYTHONPATH=research/korean_thinners_271/v2/src python research/korean_thinners_271/v2/src/audit_revision_sensitivity.py
      - name: Audit CAS-TWA assignment against parsed Korean OEL table
        run: PYTHONPATH=research/korean_thinners_271/v2/src python research/korean_thinners_271/v2/src/audit_oel_assignment.py
      - name: Upload manuscript nonexperimental sensitivity outputs
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-validation-no-lab
          path: |
            research/korean_thinners_271/v2/results/core/headline_pooled.json
            research/korean_thinners_271/v2/results/core/P2_cluster_robustness.csv
            research/korean_thinners_271/v2/results/core/P3_field_list.csv
            research/korean_thinners_271/v2/results/core/S2_models_oel_sensitivity.csv
            research/korean_thinners_271/v2/results/core/S3_document_version_audit.csv
            research/korean_thinners_271/v2/results/core/S3_revision_sensitivity.csv
            research/korean_thinners_271/v2/results/core/S4_oel_cas_mapping_audit.csv
          if-no-files-found: error
      - name: Full 270-source reproducibility pipeline (offline, no approved data)
        run: python research/korean_thinners_271/src/run_full_pipeline.py --offline
      - name: Validate no unapproved same-use rankings
        run: |
          python -c "import csv,pathlib; p=pathlib.Path('research/korean_thinners_271/output/full270/07_same_use/같은용도_낮은잠재지표_후보.csv'); assert list(csv.DictReader(p.open(encoding='utf-8-sig'))) == []"
      - name: Full-population manuscript RQ1 RQ2 RQ3 (offline, no unverified rankings)
        run: python research/korean_thinners_271/src/run_paper_research_questions.py
      - name: Assert 270-document census and honest unanswered research questions
        run: |
          python -c "import csv,json,pathlib; d=pathlib.Path('research/korean_thinners_271/output/full270/10_13_paper_questions'); rows=list(csv.DictReader((d/'00_전체270건_모델적용성및보류.csv').open(encoding='utf-8-sig'))); summary=json.loads((d/'RQ_논문실험_성립여부_판정.json').read_text(encoding='utf-8')); assert len(rows)==270; assert summary['ranked_pairs_RQ1']==0; assert summary['reversed_rank_pairs_RQ2']==0; assert summary['question3_anchor_scenarios']==0; assert summary['question1_status'].startswith('ON_HOLD')"
      - name: Generate blank, unapproved comparison templates
        run: python research/korean_thinners_271/src/screen_same_use_271.py --write-templates --output-dir /tmp/thinner_research
      - name: Generate unverified optimization template (do not run optimizer)
        run: python research/korean_thinners_271/src/optimize_verified_blend.py --write-template /tmp/constraints.json