name: Korean thinner 271 data regression
on:
  push:
    branches:
      - main
      - 'research/**'
    paths:
      - 'research/korean_thinners_271/**'
      - 'thinner_vle_reference_25C.csv'
      - '.github/workflows/korean-thinner-271.yml'
  pull_request:
    paths:
      - 'research/korean_thinners_271/**'
      - 'thinner_vle_reference_25C.csv'
      - '.github/workflows/korean-thinner-271.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate linked MSDS dataset
        run: python research/korean_thinners_271/src/validate_271.py
      - name: Model-free test suite (no HANNA checkpoints in CI)
        run: python -m unittest discover -s research/korean_thinners_271/src -p 'test_*.py' -v
      - name: Generate blank, unapproved comparison templates
        run: python research/korean_thinners_271/src/screen_same_use_271.py --write-templates --output-dir /tmp/thinner_research
      - name: Generate unverified optimization template (do not run optimizer)
        run: python research/korean_thinners_271/src/optimize_verified_blend.py --write-template /tmp/constraints.json